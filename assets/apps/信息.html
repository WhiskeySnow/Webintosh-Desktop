<div class="messages window">
    <div class="messages-sidebar">
        <div class="messages-sidebar-toolbar">
            <div class="wintools" aria-label="Window controls">
                <div class="red"></div>
                <div class="yellow"></div>
                <div class="green"></div>
            </div>

            <button class="messages-compose-new" type="button" aria-label="New message">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                    <path d="M11.9 4.2 15.8.3a1 1 0 0 1 1.4 0l2.5 2.5a1 1 0 0 1 0 1.4l-3.9 3.9-3.9-3.9Z" />
                    <path d="m10.7 5.4-7.2 7.2L2.6 17l4.4-.9 7.2-7.2" />
                    <path d="M10.4 2.8H4.5A3.5 3.5 0 0 0 1 6.3v9.2A3.5 3.5 0 0 0 4.5 19h9.2a3.5 3.5 0 0 0 3.5-3.5V9.6" />
                </svg>
            </button>
        </div>

        <div class="messages-search">
            <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="8.4" cy="8.4" r="5.4" />
                <path d="m12.4 12.4 4.2 4.2" />
            </svg>
            <span>Search</span>
        </div>
        <div class="messages-contacts"></div>
    </div>

    <div class="messages-main">
        <div class="messages-header"></div>

        <div class="messages-chat"></div>

        <div class="messages-compose">
            <button class="messages-apps-button" type="button" aria-label="iMessage apps">+</button>
            <div class="messages-composer-field">
                <input class="messages-input" placeholder="iMessage" autocomplete="off">
                <button class="messages-audio-button" type="button" aria-label="Record audio message">
                    <span></span><span></span><span></span><span></span><span></span>
                </button>
                <button class="messages-send" type="button" aria-label="Send message">↑</button>
            </div>
        </div>
    </div>
</div>
